gold:
  outputs:
    dev:
      type: athena
      region_name: ap-southeast-1
      database: awsdatacatalog
      schema: gold
      s3_data_dir: "s3://{{ env_var('DATA_BUCKET') }}/gold/"
      s3_staging_dir: "s3://{{ env_var('DATA_BUCKET') }}/athena-query-results/"
      threads: 1
  target: dev

