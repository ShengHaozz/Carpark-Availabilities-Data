version: 2

sources:
  - name: silver
    database: awsdatacatalog
    schema: silver
    description: "Raw partitioned Parquet tables in S3 populated by the Silver Lambda process."
    tables:
      - name: silver_cold
        description: "Silver cold partition dataset containing 10-minute carpark availability snapshots."
        columns:
          - name: carpark_id
            description: "Unique carpark identifier provided by LTA/HDB (e.g. C1, HE12)."
          - name: snapshot_timestamp
            description: "UTC timestamp of the 10-minute snapshot poll."
          - name: lot_type
            description: "Vehicle lot type (C: Car, H: Heavy, Y: Motorcycle, S: Special, unknown)."
          - name: lots_available
            description: "Count of currently available lots."
          - name: total_lots
            description: "Total lot capacity for this carpark and lot type (if available from HDB dataset)."
          - name: location_latitude
            description: "Latitude coordinate of the carpark."
          - name: location_longitude
            description: "Longitude coordinate of the carpark."
          - name: area
            description: "Geographical area (e.g. ORCHARD, JURONG, etc.)."
          - name: development
            description: "Name of the building or carpark development."
          - name: agency
            description: "Managing government agency (HDB, LTA, URA)."
          - name: ingestion_timestamp
            description: "Timestamp when the silver Lambda processed the data."
          - name: source_filepath
            description: "S3 path of the bronze file used to construct this record."
          - name: year
            description: "Partition year."
          - name: month
            description: "Partition month."
          - name: day
            description: "Partition day."
